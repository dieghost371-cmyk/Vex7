<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vex7 | FF Accounts & Diamonds</title>
<style>
:root{--bg:#03060f;--ink:#ece9f7;--mute:#8d88a8;--c1:#35c8ff;--c2:#1f5bff;--glass:rgba(255,255,255,.06);--line:rgba(255,255,255,.12)}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 "Trebuchet MS",system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
body::before,body::after{content:"";position:fixed;width:50vmax;height:50vmax;border-radius:50%;filter:blur(110px);opacity:.35;z-index:-1}
body::before{background:var(--c2);top:-20vmax;left:-15vmax}
body::after{background:var(--c1);bottom:-25vmax;right:-15vmax;opacity:.25}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:14px;padding:12px 18px;background:rgba(3,6,15,.6);backdrop-filter:blur(16px);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-size:26px;font-weight:900;letter-spacing:2px;text-decoration:none;color:var(--ink)}
.brand img{width:34px;height:34px;border-radius:8px;object-fit:cover}
.glitch{position:relative}
.glitch::before,.glitch::after{content:attr(data-t);position:absolute;left:0;top:0;width:100%;overflow:hidden}
.glitch::before{color:var(--c1);animation:g1 3s infinite steps(1);clip-path:inset(0 0 55% 0)}
.glitch::after{color:var(--c2);animation:g2 3s infinite steps(1);clip-path:inset(55% 0 0 0)}
@keyframes g1{0%,86%,100%{transform:none}88%{transform:translate(-3px,1px)}92%{transform:translate(3px,-1px)}}
@keyframes g2{0%,84%,100%{transform:none}87%{transform:translate(3px,1px)}93%{transform:translate(-3px,-1px)}}
nav{display:flex;gap:6px;flex:1;flex-wrap:wrap}
nav a{color:var(--mute);text-decoration:none;padding:6px 12px;border-radius:10px;font-weight:700}
nav a.on,nav a:hover{color:var(--ink);background:var(--glass)}
.user{display:flex;align-items:center;gap:8px;font-size:14px}
.user img{width:30px;height:30px;border-radius:50%}
button,.btn{font:inherit;font-weight:700;cursor:pointer;border:1px solid var(--line);background:var(--glass);color:var(--ink);padding:8px 16px;border-radius:12px;backdrop-filter:blur(10px);text-decoration:none;display:inline-flex;align-items:center;gap:8px}
button:hover,.btn:hover{border-color:var(--c1)}
button.pri{background:linear-gradient(90deg,#1f5bff,#35c8ff);border:0;box-shadow:0 0 18px rgba(53,200,255,.45)}
button.del{color:#ff7a9c}
main{max-width:980px;margin:0 auto;padding:28px 18px 80px}
h1{font-size:clamp(40px,9vw,84px);line-height:1;letter-spacing:3px}
h2{font-size:26px;margin-bottom:14px}
.sub{color:var(--mute);max-width:46ch;margin:14px 0 22px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.card{background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:16px;backdrop-filter:blur(18px)}
.card h3{font-size:18px}
.tag{font-size:12px;color:var(--c1);font-weight:700}
.price{font-size:22px;font-weight:900;margin:8px 0}
input,textarea,select{width:100%;font:inherit;color:var(--ink);background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin:4px 0}
input:focus,textarea:focus{outline:2px solid var(--c1)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>*{flex:1;min-width:130px}
.ico{width:42px;height:42px;border-radius:10px;object-fit:cover;flex:0 0 42px;min-width:0;background:var(--glass)}
.cbtn{display:flex;align-items:center;gap:12px;padding:14px;border-radius:14px;background:var(--glass);border:1px solid var(--line);color:var(--ink);text-decoration:none;font-weight:700;backdrop-filter:blur(14px)}
.cbtn:hover{border-color:var(--c2)}
.cbtn small{display:block;color:var(--mute);font-weight:400}
.stars{color:#ffd24a;letter-spacing:2px}
.note{color:var(--mute);font-size:14px}
.box{margin-bottom:26px}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
.flash{position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(circle at 50% 30%,rgba(53,200,255,.35),transparent 60%);opacity:0;animation:flash 7s infinite}
@keyframes flash{0%,92%,100%{opacity:0}93%{opacity:1}94%{opacity:.1}95%{opacity:.8}97%{opacity:0}}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;padding:10px 0 20px}
.hero img{width:min(88vw,520px);border-radius:22px;animation:float 5s ease-in-out infinite,glow 2.4s ease-in-out infinite alternate;-webkit-mask-image:radial-gradient(closest-side,#000 82%,transparent);mask-image:radial-gradient(closest-side,#000 82%,transparent)}
@keyframes float{0%,100%{transform:translateY(0) rotate(-.6deg)}50%{transform:translateY(-14px) rotate(.6deg)}}
@keyframes glow{from{filter:drop-shadow(0 0 14px rgba(53,200,255,.45))}to{filter:drop-shadow(0 0 38px rgba(31,91,255,.95))}}
.hero .sub{margin-inline:auto}
.hero .row{justify-content:center!important}
.brand img{box-shadow:0 0 14px rgba(53,200,255,.7)}
@media (prefers-reduced-motion:reduce){.hero img,.flash{animation:none}.glitch::before,.glitch::after{animation:none}}
</style>
</head>
<body>
<canvas id="fx"></canvas><div class="flash"></div>
<header>
  <a class="brand" href="#home"><img id="siteLogo" alt="" hidden><span class="glitch" data-t="vex7">vex7</span></a>
  <nav id="nav"></nav>
  <div class="user" id="user"></div>
</header>
<main id="app"></main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
// ====== SETTINGS ======
const ADMIN_EMAILS = ["dieghost371@gmail.com","Kariyamn9@gmail.com"]; // admin Google account (password code ekata danna epa)
const LOGO_URL = "https://logovexx.edgeone.dev/file.png";
const DEFAULT_CONTACTS = [{label:"WhatsApp",value:"https://wa.me/94742792801",logo:""}];
const firebaseConfig = {
  apiKey: "AIzaSyBDIhp336iS9E7un_lKocUhqgK7TLwfq1g",
  authDomain: "ghostcar-35803.firebaseapp.com",
  projectId: "ghostcar-35803",
  storageBucket: "ghostcar-35803.firebasestorage.app",
  messagingSenderId: "267645462870",
  appId: "1:267645462870:web:48bad625b58aebd4274ef7",
  measurementId: "G-NWX8J5YRGT",
  databaseURL: "https://ghostcar-35803-default-rtdb.firebaseio.com" // Realtime Database > Data tab eke thiyena URL eka ekka samana nam hari
};
firebase.initializeApp(firebaseConfig);
const BACKEND = "rtdb"; // "rtdb" = Realtime Database (hamotama realtime), "local" = browser witharai
const LOCAL_ONLY = BACKEND === "local";
// unused-old-comment: // true = data browser eke (IndexedDB) save wenawa, Firestore/Storage ona na. false = Firestore use karanawa
function makeLocalDB(){
  const open = new Promise((res,rej)=>{const r=indexedDB.open("vex7",1);r.onupgradeneeded=()=>r.result.createObjectStore("kv");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
  const subs = [];
  const get = async k => {const d=await open;return new Promise(r=>{const q=d.transaction("kv").objectStore("kv").get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r()})};
  const put = async (k,v) => {const d=await open;return new Promise(r=>{const t=d.transaction("kv","readwrite");t.objectStore("kv").put(v,k);t.oncomplete=()=>r()})};
  const col = n => {
    const load = async () => (await get("c:"+n)) || {};
    const save = async o => {await put("c:"+n,o);subs.forEach(f=>f())};
    const api = {
      doc: id => ({
        onSnapshot(cb){const f=async()=>{const o=await load();cb({exists:!!o[id],data:()=>o[id]})};subs.push(f);f()},
        async set(v){const o=await load();o[id]=v;await save(o)},
        async update(v){const o=await load();o[id]={...o[id],...v};await save(o)},
        async delete(){const o=await load();delete o[id];await save(o)}
      }),
      async add(v){const o=await load();o["l"+Date.now()+Math.random().toString(36).slice(2,6)]=v;await save(o)},
      orderBy(){return api}, limit(){return api},
      onSnapshot(cb){const f=async()=>{const o=await load();cb({docs:Object.entries(o).map(([id,v])=>({id,data:()=>v})).sort((x,y)=>(y.data().t||0)-(x.data().t||0))})};subs.push(f);f()}
    };
    return api;
  };
  return {collection: col};
}
const auth = firebase.auth();
function makeRtdb(){
  const root = firebase.database().ref("vex7_db");
  const col = n => {
    const ref = root.child(n);
    const api = {
      doc: id => ({
        onSnapshot(cb){ref.child(id).on("value",s=>cb({exists:s.exists(),data:()=>s.val()}))},
        set:v=>ref.child(id).set(v), update:v=>ref.child(id).update(v), delete:()=>ref.child(id).remove()
      }),
      add:v=>ref.push(v), orderBy(){return api}, limit(){return api},
      onSnapshot(cb){ref.on("value",s=>{const docs=[];s.forEach(c=>{docs.push({id:c.key,data:()=>c.val()})});docs.sort((x,y)=>(y.data().t||0)-(x.data().t||0));cb({docs})})}
    };
    return api;
  };
  return {collection: col};
}
const db = BACKEND === "rtdb" ? makeRtdb() : makeLocalDB();
if (LOCAL_ONLY && navigator.storage && navigator.storage.persist) navigator.storage.persist();

// ====== STATE ======
const $ = s => document.querySelector(s);
const esc = t => String(t ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let me = null, S = {contacts:DEFAULT_CONTACTS.map(c=>({...c})),payments:[],logo:""}, products = [], feedbacks = [];
const isAdmin = () => me && ADMIN_EMAILS.map(e=>e.toLowerCase()).includes((me.email||"").toLowerCase());

// local cache (browser localStorage) so the page paints instantly
try { const c = JSON.parse(localStorage.getItem("vex7_settings")||"null"); if (c) S = {...S, ...c}; } catch(e){}

// ====== DATA ======
db.collection("vex7").doc("settings").onSnapshot(d => {
  if (d.exists) { S = {...S, ...d.data()}; try{localStorage.setItem("vex7_settings", JSON.stringify(S))}catch(e){} }
  render();
});
db.collection("vex7_products").orderBy("t","desc").onSnapshot(s => { products = s.docs.map(d=>({id:d.id,...d.data()})); render(); });
db.collection("vex7_feedback").orderBy("t","desc").limit(100).onSnapshot(s => { feedbacks = s.docs.map(d=>({id:d.id,...d.data()})); render(); });
auth.onAuthStateChanged(u => { me = u; render(); });

const login = () => auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e => alert("Login failed: " + e.message));
const logout = () => auth.signOut();

// image -> small data URL (works from phone gallery / browser file picker)
function pickImage(cb){
  const i = document.createElement("input"); i.type = "file"; i.accept = "image/*";
  i.onchange = () => {
    const f = i.files[0]; if (!f) return;
    const img = new Image();
    img.onload = () => {
      const z = 160, k = Math.min(1, z/Math.max(img.width,img.height));
      const c = document.createElement("canvas"); c.width = img.width*k; c.height = img.height*k;
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      cb(c.toDataURL("image/webp",.85));
    };
    img.src = URL.createObjectURL(f);
  };
  i.click();
}
function link(v){
  v = (v||"").trim();
  if (/^(https?:|mailto:|tel:)/i.test(v)) return v;
  if (/^[\d\s+()-]{6,}$/.test(v)) return "tel:" + v.replace(/[^\d+]/g,"");
  return "https://" + v;
}

// ====== VIEWS ======
const views = {
  home(){
    const accs = products.filter(p=>p.type==="account"), dias = products.filter(p=>p.type==="diamond");
    const list = (a,t) => `<div class="box"><h2>${t}</h2><div class="grid">${a.map(p=>`
      <div class="card"><span class="tag">${esc(p.type)}</span><h3>${esc(p.title)}</h3>
      <div class="price">Rs ${esc(p.price)}</div><p class="note">${esc(p.desc)}</p>
      <a class="btn pri" href="#payment" style="margin-top:10px">Buy now</a></div>`).join("") || `<p class="note">Nothing listed yet.</p>`}</div></div>`;
    return `<div class="hero"><img src="${S.logo||LOGO_URL}" alt="ADMIN VEX7" onerror="this.outerHTML='<h1 class=&quot;glitch&quot; data-t=&quot;vex7&quot;>vex7</h1>'">
      <p class="sub">SG region trusted FF account and diamond selling. Pick an item, check the payment options, then contact us on WhatsApp.</p>
      <div class="row"><a class="btn pri" href="#payment" style="flex:0">Payment options</a><a class="btn" href="#contact" style="flex:0">Contact</a></div></div>
      ${list(accs,"FF accounts")}${list(dias,"Diamonds")}`;
  },
  contact(){
    return `<h2>Contact</h2><div class="grid">${S.contacts.map(c=>`
      <a class="cbtn" href="${esc(link(c.value))}" target="_blank" rel="noopener">
      ${c.logo?`<img class="ico" src="${c.logo}" alt="">`:""}<span>${esc(c.label)}<small>${esc(c.value)}</small></span></a>`).join("") || `<p class="note">No contact info yet.</p>`}</div>`;
  },
  payment(){
    return `<h2>Payment options</h2><div class="grid">${S.payments.map(p=>`
      <div class="card"><div class="row" style="flex-wrap:nowrap">${p.logo?`<img class="ico" src="${p.logo}" alt="">`:""}<h3>${esc(p.name)}</h3></div>
      <p class="note" style="white-space:pre-wrap;margin-top:8px">${esc(p.details)}</p></div>`).join("") || `<p class="note">No payment methods yet.</p>`}</div>`;
  },
  feedback(){
    const form = me ? `<div class="card box"><h3>Leave feedback</h3>
      <select id="fbStars">${[5,4,3,2,1].map(n=>`<option value="${n}">${"★".repeat(n)}</option>`).join("")}</select>
      <textarea id="fbText" rows="3" placeholder="Write your feedback"></textarea>
      <button class="pri" onclick="sendFb()">Send feedback</button></div>`
      : `<div class="card box"><p>Sign in with Google to leave feedback.</p><br><button class="pri" onclick="login()">Sign in with Google</button></div>`;
    const list = feedbacks.map(f=>`<div class="card" style="margin-bottom:10px">
      <div class="row" style="flex-wrap:nowrap;justify-content:flex-start">${f.photo?`<img class="ico" style="border-radius:50%" src="${esc(f.photo)}" alt="">`:""}
      <div><b>${esc(f.name)}</b> <span class="stars">${"★".repeat(f.stars||5)}</span></div></div>
      <p style="margin-top:6px;white-space:pre-wrap">${esc(f.text)}</p>
      ${isAdmin()?`<div class="row" style="justify-content:flex-start;margin-top:8px"><button style="flex:0" onclick="editFb('${f.id}')">Edit</button><button class="del" style="flex:0" onclick="delFb('${f.id}')">Delete</button></div>`:""}</div>`).join("") || `<p class="note">No feedback yet.</p>`;
    return `<h2>Feedback</h2>${form}${list}`;
  },
  admin(){
    if (!isAdmin()) return `<div class="card"><h3>Admin only</h3><p class="note">Sign in with an admin Google account.</p><br>${me?"":`<button class="pri" onclick="login()">Sign in with Google</button>`}</div>`;
    const rows = (arr,k,f1,f2) => arr.map((x,i)=>`<div class="card" style="margin-bottom:10px"><div class="row">
      ${x.logo?`<img class="ico" src="${x.logo}" alt="">`:`<span class="ico"></span>`}
      <input value="${esc(x[f1])}" placeholder="${f1}" oninput="S.${k}[${i}].${f1}=this.value">
      <input value="${esc(x[f2])}" placeholder="${f2}" oninput="S.${k}[${i}].${f2}=this.value"></div>
      <div class="row" style="justify-content:flex-start;margin-top:6px"><button style="flex:0" onclick="pickImage(d=>{S.${k}[${i}].logo=d;render()})">Choose logo</button>
      <button class="del" style="flex:0" onclick="S.${k}.splice(${i},1);render()">Remove</button></div></div>`).join("");
    return `<h2>Admin panel</h2>
    <div class="card box"><h3>Site logo</h3><div class="row" style="justify-content:flex-start;margin-top:8px">${S.logo?`<img class="ico" src="${S.logo}" alt="">`:""}
      <button style="flex:0" onclick="pickImage(d=>{S.logo=d;render()})">Choose logo</button><button class="del" style="flex:0" onclick="S.logo='';render()">Remove</button></div></div>
    <div class="box"><h3>Contact buttons</h3><p class="note">label = button text, value = phone number or link</p>${rows(S.contacts,"contacts","label","value")}
      <button onclick="S.contacts.push({label:'',value:'',logo:''});render()">Add contact</button></div>
    <div class="box"><h3>Payment options</h3>${rows(S.payments,"payments","name","details")}
      <button onclick="S.payments.push({name:'',details:'',logo:''});render()">Add payment method</button></div>
    <button class="pri" onclick="saveSettings()">Save changes</button>
    <div class="box" style="margin-top:30px"><h3>Add product</h3><div class="card">
      <select id="pType"><option value="account">FF account</option><option value="diamond">Diamonds</option></select>
      <input id="pTitle" placeholder="Title"><input id="pPrice" placeholder="Price (Rs)"><textarea id="pDesc" rows="2" placeholder="Description"></textarea>
      <button class="pri" onclick="addProduct()">Add product</button></div></div>
    <div class="box"><h3>Products</h3>${products.map(p=>`<div class="card row" style="margin-bottom:8px"><span><b>${esc(p.title)}</b> · Rs ${esc(p.price)} · ${esc(p.type)}</span>
      <span class="row" style="flex:0;flex-wrap:nowrap"><button onclick="editProduct('${p.id}')">Edit</button><button class="del" onclick="delProduct('${p.id}')">Delete</button></span></div>`).join("")}</div>`;
  }
};

// ====== ACTIONS ======
async function saveSettings(){
  try { await db.collection("vex7").doc("settings").set({contacts:S.contacts,payments:S.payments,logo:S.logo||""}); alert("Saved"); }
  catch(e){ alert("Save failed: " + e.message); }
}
async function sendFb(){
  const text = $("#fbText").value.trim(); if (!text) return alert("Write something first");
  await db.collection("vex7_feedback").add({text,stars:+$("#fbStars").value,name:me.displayName||"User",photo:me.photoURL||"",uid:me.uid,t:Date.now()});
}
async function editFb(id){ const f = feedbacks.find(x=>x.id===id); const t = prompt("Edit feedback", f.text); if (t!==null) db.collection("vex7_feedback").doc(id).update({text:t}); }
function delFb(id){ if (confirm("Delete this feedback?")) db.collection("vex7_feedback").doc(id).delete(); }
function addProduct(){
  const title = $("#pTitle").value.trim(); if (!title) return alert("Title needed");
  db.collection("vex7_products").add({type:$("#pType").value,title,price:$("#pPrice").value,desc:$("#pDesc").value,t:Date.now()});
}
function editProduct(id){
  const p = products.find(x=>x.id===id);
  const title = prompt("Title", p.title); if (title===null) return;
  const price = prompt("Price (Rs)", p.price); if (price===null) return;
  const desc = prompt("Description", p.desc); if (desc===null) return;
  db.collection("vex7_products").doc(id).update({title,price,desc});
}
function delProduct(id){ if (confirm("Delete this product?")) db.collection("vex7_products").doc(id).delete(); }

// ====== RENDER ======
function render(){
  const page = (location.hash.slice(1) || "home"), v = views[page] ? page : "home";
  const items = [["home","Home"],["payment","Payment"],["feedback","Feedback"],["contact","Contact"]];
  if (isAdmin()) items.push(["admin","Admin"]);
  $("#nav").innerHTML = items.map(([k,t])=>`<a href="#${k}" class="${k===v?"on":""}">${t}</a>`).join("");
  $("#user").innerHTML = me ? `${me.photoURL?`<img src="${esc(me.photoURL)}" alt="">`:""}<span>${esc(me.displayName||"")}</span><button onclick="logout()">Sign out</button>` : `<button class="pri" onclick="login()">Sign in with Google</button>`;
  const L = $("#siteLogo"); L.src = S.logo || LOGO_URL; L.hidden = false; L.onerror = () => L.hidden = true;
  // keep typing focus in admin inputs: only re-render main when not typing in it
  const a = document.activeElement;
  if (a && $("#app").contains(a) && /INPUT|TEXTAREA/.test(a.tagName) && !render.force) return;
  $("#app").innerHTML = views[v]();
}
(function(){
  const c=$("#fx"),x=c.getContext("2d");let w,h,P=[];
  const size=()=>{w=c.width=innerWidth;h=c.height=innerHeight};size();addEventListener("resize",size);
  for(let i=0;i<70;i++)P.push({x:Math.random()*w,y:Math.random()*h,r:Math.random()*2+.5,v:Math.random()*.8+.2,d:Math.random()*2-1});
  let bolt=null,t=0;
  function mkBolt(){let px=Math.random()*w,py=0,pts=[[px,py]];while(py<h*.6){px+=Math.random()*60-30;py+=Math.random()*40+20;pts.push([px,py])}bolt={pts,life:8}}
  function loop(){
    x.clearRect(0,0,w,h);
    P.forEach(p=>{p.y-=p.v;p.x+=p.d*.3;if(p.y<-5){p.y=h+5;p.x=Math.random()*w}
      x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fillStyle="rgba(80,200,255,.8)";x.shadowColor="#35c8ff";x.shadowBlur=10;x.fill()});
    if(++t%420===0)mkBolt();
    if(bolt){x.beginPath();bolt.pts.forEach((q,i)=>i?x.lineTo(q[0],q[1]):x.moveTo(q[0],q[1]));
      x.strokeStyle="rgba(170,230,255,"+bolt.life/8+")";x.lineWidth=2;x.shadowBlur=20;x.stroke();if(--bolt.life<0)bolt=null}
    requestAnimationFrame(loop)}
  if(!matchMedia("(prefers-reduced-motion:reduce)").matches)loop();
})();
window.addEventListener("hashchange", () => { render.force = true; render(); render.force = false; });
render();
</script>
</body>
</html>
